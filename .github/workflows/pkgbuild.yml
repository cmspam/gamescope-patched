name: Build and Publish Gamescope

on:
  schedule:
    # Daily at 14:00 UTC — 4 hours before cache22's 18:00 image build,
    # so cache22's pacman -S sees fresh v3-rebuilt gamescope binaries.
    - cron: '0 14 * * *'
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

env:
  ARCH_API: https://gitlab.archlinux.org/api/v4/projects/archlinux%2Fpackaging%2Fpackages%2Fgamescope

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
      sde: ${{ steps.get_tag.outputs.sde }}
      needs_build: ${{ steps.check.outputs.needs_build }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get latest Arch Gamescope packaging tag
        id: get_tag
        run: |
          set -euo pipefail
          # Arch rather than CachyOS: CachyOS's gamescope lags Arch by weeks,
          # and this repo exists to give the cachyos-v3 base a gamescope that
          # is current. The tag name is already pkgver-pkgrel. Its commit date
          # becomes SOURCE_DATE_EPOCH downstream.
          curl -sf "${ARCH_API}/repository/tags?order_by=updated&sort=desc&per_page=1" > tags.json
          FULL_VER=$(python3 -c "import sys,json; d=json.load(open('tags.json')); print(d[0]['name']) if d else sys.exit(1)")
          SDE=$(python3 -c "import json,datetime as dt; d=json.load(open('tags.json'))[0]['commit']['committed_date']; print(int(dt.datetime.fromisoformat(d.replace('Z','+00:00')).timestamp()))")
          echo "Latest Gamescope version: $FULL_VER (SDE=$SDE)"
          echo "tag=$FULL_VER" >> "$GITHUB_OUTPUT"
          echo "sde=$SDE" >> "$GITHUB_OUTPUT"

      - name: Check if already built
        id: check
        run: |
          # Force daily rebuild against current Arch state. Pre-built
          # binaries on rolling Arch get stale as upstream library
          # sonames bump (mesa, vulkan-loader, openssl, glibc, …).
          # Rebuilding daily keeps everything linked against current
          # libs even when pkgver hasn't changed.
          LATEST="${{ steps.get_tag.outputs.tag }}"
          LAST="$(cat last_built_version.txt 2>/dev/null || echo '')"
          echo "Last built: '$LAST' | Latest: '$LATEST' (forced rebuild)"
          echo "needs_build=true" >> "$GITHUB_OUTPUT"

  build:
    needs: get-version
    if: needs.get-version.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: v3
            docker_image: cachyos/cachyos-v3
            march_flag: "-march=x86-64-v3 -mtune=generic"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Gamescope PKGBUILD and supporting files
        run: |
          set -euo pipefail
          TAG='${{ needs.get-version.outputs.tag }}'
          mkdir -p build
          # Every file at the tag, so a patch the PKGBUILD's source array
          # gains later is present without touching this workflow.
          curl -sf "${ARCH_API}/repository/tree?ref=${TAG}&per_page=100" \
            | python3 -c "import json,sys; [print(f['name']) for f in json.load(sys.stdin) if f['type']=='blob']" \
            | while read -r name; do
                echo "Fetching $name"
                curl -sfL "https://gitlab.archlinux.org/archlinux/packaging/packages/gamescope/-/raw/${TAG}/${name}" \
                  -o "build/${name}"
              done
          test -s build/PKGBUILD
          echo "Files in build/:"
          ls -la build/

      - name: Build package
        run: |
          # Reproducibility: SOURCE_DATE_EPOCH is the Arch packaging tag's
          # commit timestamp. Same tag means same SDE and a reproducible
          # build, modulo cachyos-v3 toolchain drift, which is what the
          # daily rebuild is for.
          PKG_SDE='${{ needs.get-version.outputs.sde }}'
          echo "Arch packaging tag timestamp: $PKG_SDE ($(date -u -d @$PKG_SDE))"
          docker run --rm \
            --privileged \
            -e SOURCE_DATE_EPOCH="$PKG_SDE" \
            -e KBUILD_BUILD_TIMESTAMP="@$PKG_SDE" \
            -e KBUILD_BUILD_USER=cmspam \
            -e KBUILD_BUILD_HOST=cmspam-build \
            -v "$PWD/build:/pkg" \
            "${{ matrix.docker_image }}" \
            bash -c "
              set -e
              echo '=== Initializing Keyring ==='
              pacman-key --init
              pacman-key --populate archlinux cachyos

              echo '=== Prefer a CachyOS mirror with a complete pool ==='
              # cdn77 serves 404 for packages its pool has not synced yet, and
              # us.cachyos.org answers 522. Those are mirrors 1 and 2 in the
              # shipped list and pacman does not fall past them here, so one
              # lagging pool fails the whole job no matter how often we retry.
              # Put a mirror that carries the full pool first, drop the dead one.
              for f in /etc/pacman.d/cachyos*mirrorlist*; do
                [ -f \"\$f\" ] || continue
                suffix=\$(grep -m1 -oE 'Server = https?://[^/]+(/.*)' \"\$f\" | sed -E 's|Server = https?://[^/]+||')
                [ -n \"\$suffix\" ] || continue
                sed -i '/us\\.cachyos\\.org/d' \"\$f\"
                sed -i \"1i Server = https://mirror.cachyos.org\$suffix\" \"\$f\"
                echo \"\$f -> \$(head -1 \"\$f\")\"
              done

              echo '=== Updating system ==='
              pacman -Syu --noconfirm

              echo '=== Installing build dependencies ==='
              pacman -S --noconfirm --needed base-devel git

              echo '=== Setting up build user ==='
              useradd -m builder
              echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
              chown -R builder:builder /pkg

              echo '=== Reproducibility flags in makepkg.conf ==='
              # -ffile-prefix-map normalizes embedded source paths.
              # --build-id=sha1 makes linker IDs deterministic.
              # PACKAGER pinned to remove makepkg metadata variance.
              printf '%s\n' \\
                  '' \\
                  '# Reproducibility additions' \\
                  'CFLAGS=\"\$CFLAGS -ffile-prefix-map=/tmp=/build -ffile-prefix-map=/home/builder=/build\"' \\
                  'CXXFLAGS=\"\$CXXFLAGS -ffile-prefix-map=/tmp=/build -ffile-prefix-map=/home/builder=/build\"' \\
                  'LDFLAGS=\"\$LDFLAGS -Wl,--build-id=sha1\"' \\
                  'PACKAGER=\"cmspam <cmspam@localhost>\"' \\
                  >> /etc/makepkg.conf

              echo '=== Building package ==='
              cd /pkg
              export CFLAGS='${{ matrix.march_flag }} -O3 -pipe'
              export CXXFLAGS='${{ matrix.march_flag }} -O3 -pipe'
              # sudo -E preserves env (SOURCE_DATE_EPOCH etc) but also
              # inherits HOME=/root from the docker bash; -H sets HOME
              # back to /home/builder so makepkg/cargo/etc find their
              # caches in the right place.
              #
              # Retried: makepkg -s resolves build deps through pacman, and a
              # CachyOS mirror serving a 404 for a package it has not synced
              # yet, or a 522, fails the whole job. Resync the databases
              # between attempts. A real build error exhausts all five and
              # still exits non-zero.
              for attempt in 1 2 3 4 5; do
                echo \"=== makepkg attempt \$attempt ===\"
                if sudo -E -H -u builder makepkg -sf --noconfirm; then
                  break
                fi
                if [ \"\$attempt\" = '5' ]; then
                  echo 'makepkg failed after 5 attempts' >&2
                  exit 1
                fi
                echo \"attempt \$attempt failed; resyncing and retrying in 60s\" >&2
                sleep 60
                pacman -Syy --noconfirm || true
              done
            "

      - name: Generate pacman database
        run: |
          REPO_NAME="gamescope-patched-${{ matrix.target }}"
          mkdir -p /tmp/repo
          cp build/*.pkg.tar.zst /tmp/repo/

          docker run --rm \
            -v /tmp/repo:/repo \
            "${{ matrix.docker_image }}" \
            bash -c "
              pacman -Sy --noconfirm --needed pacman 2>&1 | tail -3
              cd /repo
              repo-add ${REPO_NAME}.db.tar.gz *.pkg.tar.zst
              ln -sf ${REPO_NAME}.db.tar.gz ${REPO_NAME}.db
              ln -sf ${REPO_NAME}.files.tar.gz ${REPO_NAME}.files
            "

      - name: Create versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Retry wrapper: api.github.com returns transient 5xx often
          # enough that a single attempt leaves successful builds
          # unpublished. Exponential backoff over ~5 attempts.
          retry() {
              local n=0 max=5 delay=5
              until "$@"; do
                  n=$((n + 1))
                  if [ "$n" -ge "$max" ]; then
                      echo "Command failed after $max attempts: $*" >&2
                      return 1
                  fi
                  echo "Attempt $n failed; retrying in ${delay}s..." >&2
                  sleep "$delay"
                  delay=$((delay * 2))
              done
          }

          TAG="${{ needs.get-version.outputs.tag }}"
          VERSIONED_TAG="${TAG}-${{ matrix.target }}"

          # Create the release once (idempotent: ignore "already exists"),
          # then upload assets with --clobber. This survives a retry after
          # a partial failure without ever leaving the tag release-less.
          retry gh release create "$VERSIONED_TAG" \
            --title "Gamescope ${TAG} (${{ matrix.target }})" \
            --notes "Gamescope \`${TAG}\`, Arch packaging rebuilt for x86-64-v3." \
            || gh release view "$VERSIONED_TAG" >/dev/null
          retry gh release upload "$VERSIONED_TAG" --clobber build/*.pkg.tar.zst

      - name: Update latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          retry() {
              local n=0 max=5 delay=5
              until "$@"; do
                  n=$((n + 1))
                  if [ "$n" -ge "$max" ]; then
                      echo "Command failed after $max attempts: $*" >&2
                      return 1
                  fi
                  echo "Attempt $n failed; retrying in ${delay}s..." >&2
                  sleep "$delay"
                  delay=$((delay * 2))
              done
          }

          TAG="${{ needs.get-version.outputs.tag }}"
          LATEST_TAG="latest-${{ matrix.target }}"
          REPO_NAME="gamescope-patched-${{ matrix.target }}"

          retry gh release create "$LATEST_TAG" \
            --title "Gamescope latest (${{ matrix.target }}) — ${TAG}" \
            --notes "## pacman.conf
            \`\`\`ini
            [${REPO_NAME}]
            SigLevel = Optional
            Server = https://github.com/cmspam/gamescope-patched/releases/download/${LATEST_TAG}
            \`\`\`" \
            || gh release view "$LATEST_TAG" >/dev/null

          # Refresh the title to the current TAG even when the release
          # already existed from a prior run.
          retry gh release edit "$LATEST_TAG" \
            --title "Gamescope latest (${{ matrix.target }}) — ${TAG}"

          retry gh release upload "$LATEST_TAG" --clobber \
            build/*.pkg.tar.zst \
            /tmp/repo/${REPO_NAME}.db.tar.gz \
            /tmp/repo/${REPO_NAME}.db \
            /tmp/repo/${REPO_NAME}.files.tar.gz \
            /tmp/repo/${REPO_NAME}.files

          # Drop packages this run superseded. The database only indexes the
          # current one, so older assets are dead weight users still download
          # the release listing for.
          # /tmp/repo holds exactly this run's packages plus the database.
          ls /tmp/repo > /tmp/keep.txt
          gh release view "$LATEST_TAG" --json assets -q '.assets[].name' \
            | grep -vxF -f /tmp/keep.txt > /tmp/stale.txt || true
          while read -r asset; do
            [ -n "$asset" ] || continue
            echo "Removing superseded asset ${asset}"
            retry gh release delete-asset "$LATEST_TAG" "$asset" --yes
          done < /tmp/stale.txt

  record-version:
    needs: [get-version, build]
    if: needs.get-version.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          TAG="${{ needs.get-version.outputs.tag }}"
          echo "$TAG" > last_built_version.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # last_built_version.txt only changes when upstream pkgver
          # bumps. Daily soname-drift rebuilds keep the same TAG, so
          # without the diff guard `git commit` fails "nothing to commit"
          # and exits 1, marking the otherwise-successful build as failed.
          if git diff --quiet last_built_version.txt; then
              echo "last_built_version.txt unchanged ($TAG) — skipping commit."
              exit 0
          fi
          git add last_built_version.txt
          git commit -m "chore: record built version $TAG [skip ci]"
          git push
